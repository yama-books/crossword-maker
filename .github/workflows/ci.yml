name: Validate crossword data

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate puzzle rules and existing game
        run: npm test
      - name: Check classical clue bank and review states
        run: npm run kogo:check
      - name: Measure internal 5x5 classical puzzle previews (fixed seeds)
        run: npm run kogo:measure
      - name: Check generated player is up to date
        run: npm run check
      - name: Build static site
        run: npm run build
